services:
  # Backend API (TypeScript — apps/backend)
  - type: web
    name: guidely-backend
    runtime: node
    rootDir: apps/backend
    buildCommand: npm install && npx prisma generate && npx tsc
    startCommand: node dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        value: https://guidely-t9qi-ddhyp2qvl-yash-crypto-bs-projects.vercel.app
      # These must be set in the Render dashboard (Settings > Environment):
      # - DATABASE_URL (PostgreSQL connection string)
      # - JWT_SECRET
      # - STRIPE_SECRET_KEY
      # - STRIPE_WEBHOOK_SECRET
      # - SUPABASE_URL
      # - SUPABASE_SECRET_KEY
      # - SUPABASE_JWT_SECRET
    healthCheckPath: /health

  # ─── Keepalive ───────────────────────────────────────────────────────
  # The backend self-pings /health/keepalive every 10 min on startup.
  # For Render free-tier, also set up an external cron to prevent spin-down:
  #   Option A: cron-job.org (free) — ping https://guidely-backend.onrender.com/health/keepalive
  #   Option B: UptimeRobot (free) — add HTTP monitor on /health/keepalive
  #   Option C: node scripts/keepalive.js (run on any server)
