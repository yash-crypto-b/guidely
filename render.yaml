services:
  # Backend API
  - type: web
    name: guidely-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: FRONTEND_ORIGIN
        sync: false  # Set to your Vercel frontend URL in Render dashboard
    healthCheckPath: /health
